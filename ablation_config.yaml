model:
  dit_path: /root/autodl-tmp/models/wan_1.3b/diffusion_pytorch_model.safetensors
  vae_path: /root/autodl-tmp/models/wan_1.3b/Wan2.1_VAE.pth
  text_encoder_path: /root/autodl-tmp/models/wan_1.3b/models_t5_umt5-xxl-enc-bf16.pth
  image_encoder_path: /root/autodl-tmp/models/wan_1.3b/models_clip_open-clip-xlm-roberta-large-vit-huge-14.pth
  motion_controller_path: /root/autodl-tmp/models/DiffSynth-Studio/Wan2.1-1.3b-speedcontrol-v1/model.safetensors
  vace_dir: /root/autodl-tmp/models/iic/VACE-Wan2.1-1.3B-Preview
  checkpoint_path: /root/autodl-tmp/models/motioncanvas/model.pt

defaults:
  height: 480
  width: 832
  num_frames: 49
  num_inference_steps: 50
  cfg_scale: 5.0
  sigma_shift: 5.0
  seed: 42
  fps: 15

llm:
  base_url: https://api.siliconflow.cn/v1
  api_key: ${API_KEY}
  model: Pro/moonshotai/Kimi-K2.5
  timeout: 60
  send_image: true
  gdino_model_dir: /root/autodl-tmp/models/grounding_dino/GroundingDINO
  sam_ckpt: /root/autodl-tmp/models/segment_anything/sam_vit_h_4b8939.pth
  sam_type: vit_h

experiments:
  # ════════════════════════════════════════════
  # Direct 模式：同一张图、同一 prompt，只改一个变量
  # 用于消融对比：控制信号 / prompt / seed
  # ════════════════════════════════════════════

  - name: 01_cat_direct_bbox_only
    image: data/input_img/cat.png
    prompt: "a silver tabby cat with a white chest resting on a pink cushion by a window, soft daylight, shallow depth of field"
    bbox_json: '{"objects": [{"frames": {"0": [0.1, 0.25, 0.4, 0.8], "24": [0.55, 0.25, 0.85, 0.8]}}]}'

  - name: 02_cat_direct_bbox_camera
    image: data/input_img/cat.png
    prompt: "a silver tabby cat with a white chest resting on a pink cushion by a window, soft daylight, shallow depth of field"
    bbox_json: '{"objects": [{"frames": {"0": [0.1, 0.25, 0.4, 0.8], "24": [0.55, 0.25, 0.85, 0.8]}}]}'
    camera_json: '{"camera": {"keyframes": [{"frame": 0, "zoom": 1.0, "pan": [0, 0], "rotation": 0}, {"frame": 24, "zoom": 1.3, "pan": [0, 0], "rotation": 0}]}}'

  - name: 03_cat_direct_diff_prompt
    image: data/input_img/cat.png
    prompt: "a silver tabby cat with a white chest resting on a pink cushion by a window, overcast rainy day ambience, cooler tones, gentle reflections on the glass"
    bbox_json: '{"objects": [{"frames": {"0": [0.1, 0.25, 0.4, 0.8], "24": [0.55, 0.25, 0.85, 0.8]}}]}'

  - name: 04_cat_direct_seed99
    image: data/input_img/cat.png
    prompt: "a silver tabby cat with a white chest resting on a pink cushion by a window, soft daylight, shallow depth of field"
    bbox_json: '{"objects": [{"frames": {"0": [0.1, 0.25, 0.4, 0.8], "24": [0.55, 0.25, 0.85, 0.8]}}]}'
    camera_json: '{"camera": {"keyframes": [{"frame": 0, "zoom": 1.0, "pan": [0, 0], "rotation": 0}]}}'
    seed: 99

  # ════════════════════════════════════════════
  # LLM 模式：让 LLM 自己决定 prompt / bbox / camera
  # ════════════════════════════════════════════

  - name: 05_cat_llm
    image: data/input_img/cat.png
    llm_instruction: "a silver tabby cat with white chest lying on a pink cushion by a window, soft daylight, shallow depth of field. The cat slowly raises its head and turns slightly to the right, small ear twitch. Camera remains static."

  - name: 06_cat2_llm
    image: data/input_img/cat2.png
    llm_instruction: "a tabby cat sitting on a stone ledge in a lush garden, green bushes and soft bokeh. The cat looks left, then turns to face forward and shifts its posture slightly, tail resting on the ledge. Camera static."

  - name: 07_bear_llm
    image: data/input_img/bear.jpg
    llm_instruction: "a brown bear in a forest clearing beside a calm lake, warm golden hour light and misty background. The bear takes a few slow steps forward from left to right, head slightly lowered. Camera gently zooms in."

  - name: 08_woman_llm
    image: data/input_img/woman.png
    llm_instruction: "a young woman with long brown hair and sunglasses, holding a DSLR camera, standing near a large white cruise ship under bright blue sky. She smiles and turns her head slightly to the left while adjusting the camera in her hands. Camera slow push-in."
